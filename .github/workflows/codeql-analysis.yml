name: "LuhnDotNet - CodeQL"

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  schedule:
    - cron: '18 17 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # 'actions' analyzes the workflow files themselves, for example for
        # injection of untrusted input into run steps.
        language: [ 'csharp', 'actions' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # The .NET build steps apply only to the C# analysis; 'actions' is a
    # no-build CodeQL language, so its matrix leg skips setup, restore and
    # build.
    - name: Setup .NET SDKs
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v5.1.0
      with:
        dotnet-version: |
          10.0.404
          11.0.100

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Restore
      if: matrix.language == 'csharp'
      run: dotnet restore LuhnDotNet.slnx

    - name: Build
      if: matrix.language == 'csharp'
      run: dotnet build --configuration Release --no-restore LuhnDotNet.slnx

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
