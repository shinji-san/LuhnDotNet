name: LuhnDotNet - Build and Test All .NET Versions

on:
  push:
    # '**' instead of '*': a single asterisk does not match a slash, so
    # branches such as dependabot/nuget/... never triggered this workflow.
    branches:
    - '**'
    tags-ignore:
    - '**'
    paths-ignore:
    - '**.md'
  pull_request:
    branches:
    - develop
    - main
    paths-ignore:
    - '**.md'

# A push to a branch with an open pull request starts two runs (push and
# pull_request). Newer commits cancel the runs of older ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
    - uses: actions/checkout@v6

    # The SDKs are installed for their runtimes: the net10.0 and net11.0 test
    # runs need them. Without a global.json the newest SDK on the runner
    # image performs the build.
    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v5.1.0
      with:
        dotnet-version: |
          10.0.404
          11.0.100

    - name: Restore
      run: dotnet restore LuhnDotNet.slnx

    - name: Build
      run: dotnet build --configuration Release --no-restore LuhnDotNet.slnx

    # Since the .NET 11 SDK, 'dotnet test' refuses to run .NET Framework
    # test assemblies on Linux (it no longer launches them through Mono) and
    # exits with code 1. The net472/net48/net481 suites therefore run in the
    # build-windows job on the real .NET Framework. Each modern target
    # framework is invoked with an explicit --framework so that the runner
    # never tries to start a .NET Framework test assembly here.
    - name: Test (net10.0)
      run: dotnet test --no-restore --no-build --configuration Release --framework net10.0 tests/LuhnDotNetTest.csproj

    - name: Test (net11.0)
      run: dotnet test --no-restore --no-build --configuration Release --framework net11.0 tests/LuhnDotNetTest.csproj

    - name: Prepare README.md for NuGet package
      run: |
        grep -n "## Install LuhnDotNet package" README.md | cut -d: -f 1| xargs -i tail -n +{} README.md > TMP.md && sed -i '1s/^/# Setup\r\n/' TMP.md && mv -f TMP.md README.md
        grep -n "# CLI building instructions" README.md | cut -d: -f 1| xargs -i head -n {} README.md | head -n -1 > TMP.md && mv -f TMP.md README.md

    - name: Create Package
      run: dotnet pack --no-restore --no-build --configuration Release LuhnDotNet.slnx

  build-windows:

    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v5.1.0
      with:
        dotnet-version: |
          10.0.404
          11.0.100

    - name: Restore
      run: dotnet restore LuhnDotNet.slnx

    - name: Build
      run: dotnet build --configuration Release --no-restore LuhnDotNet.slnx

    # The net472/net48/net481 suites run here on the real .NET Framework the
    # assemblies target. They are the only suites that execute the code path
    # behind the '#else' of NET8_0_OR_GREATER.
    - name: Test (net472)
      run: dotnet test --no-restore --no-build --configuration Release --framework net472 tests/LuhnDotNetTest.csproj

    - name: Test (net48)
      run: dotnet test --no-restore --no-build --configuration Release --framework net48 tests/LuhnDotNetTest.csproj

    - name: Test (net481)
      run: dotnet test --no-restore --no-build --configuration Release --framework net481 tests/LuhnDotNetTest.csproj
