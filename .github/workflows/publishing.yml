name: LuhnDotNet - NuGet Publishing

on:
  push:
    tags:
    - 'v*'
    paths-ignore:
    - '**.md'

# The repository default for the workflow token is not relied on. Both jobs
# only read the sources. The package is pushed to nuget.org with its own API
# key, not with this token.
permissions:
  contents: read

jobs:
  # Since the .NET 11 SDK, 'dotnet test' refuses to run .NET Framework test
  # assemblies on Linux, so the net472/net48/net481 suites cannot run in the
  # publishing job below. They gate it from here instead: 'needs' keeps a
  # release from publishing unless they pass on the real .NET Framework,
  # mirroring the job split in dotnetall.yml.
  test-windows:

    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
    # No later step needs the git token: restore talks to nuget.org and
    # nothing pushes to the repository.
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v5.1.0
      with:
        dotnet-version: |
          10.0.404
          11.0.100

    - name: Restore
      run: dotnet restore LuhnDotNet.slnx

    - name: Build
      run: dotnet build --configuration Release --no-restore LuhnDotNet.slnx

    - name: Test (net472)
      run: dotnet test --no-restore --no-build --configuration Release --framework net472 tests/LuhnDotNetTest.csproj

    - name: Test (net48)
      run: dotnet test --no-restore --no-build --configuration Release --framework net48 tests/LuhnDotNetTest.csproj

    - name: Test (net481)
      run: dotnet test --no-restore --no-build --configuration Release --framework net481 tests/LuhnDotNetTest.csproj

  build:

    needs: test-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
    # No later step needs the git token: restore talks to nuget.org and
    # nothing pushes to the repository.
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v5.1.0
      with:
        dotnet-version: |
          10.0.404
          11.0.100

    - name: Decrypt large secret
      run: ./.github/secrets/decrypt_publisher_snk.sh
      env:
        PUBLISHER_SNK: ${{ secrets.PUBLISHER_SNK }}
        PUBLISHER_PUB_KEY: ${{ secrets.PUBLISHER_PUB_KEY }}

    - name: Restore
      run: dotnet restore LuhnDotNet.slnx

    - name: Build
      run: dotnet build --no-restore --configuration Release LuhnDotNet.slnx

    # Only the modern target frameworks run here. The .NET Framework suites
    # already ran in the test-windows job, which gates this job through
    # 'needs'.
    - name: Test (net10.0)
      run: dotnet test --no-restore --no-build --configuration Release --framework net10.0 tests/LuhnDotNetTest.csproj

    - name: Test (net11.0)
      run: dotnet test --no-restore --no-build --configuration Release --framework net11.0 tests/LuhnDotNetTest.csproj

    - name: Remove obsolete NuGet packages
      run: rm -f src/bin/Release/LuhnDotNet*.nupk

    - name: Prepare README.md for NuGet package
      run: |
        grep -n "## Install LuhnDotNet package" README.md | cut -d: -f 1| xargs -i tail -n +{} README.md > TMP.md && sed -i '1s/^/# Setup\r\n/' TMP.md && mv -f TMP.md README.md
        grep -n "# CLI building instructions" README.md | cut -d: -f 1| xargs -i head -n {} README.md | head -n -1 > TMP.md && mv -f TMP.md README.md

    - name: Create package
      run: dotnet pack --no-restore --no-build --configuration Release LuhnDotNet.slnx

    - name: Publish package
      run: dotnet nuget push $(find src/bin/Release -type f  -name 'LuhnDotNet*.nupkg' -print 2> /dev/null) -k  ${{ secrets.NUGET_API_KEY }}  -s https://api.nuget.org/v3/index.json --skip-duplicate
